<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JIA Alabang Media: Sunday checklist, live camera, Program Team and team files in one place.">
  <meta property="og:title" content="JIA Alabang · Media Desk">
  <meta property="og:description" content="Sunday checklist, live camera, Program Team and team files in one place.">
  <meta property="og:image" content="https://jia-media-desk.firebaseapp.com/jia-logo-green.png">
  <meta property="og:url" content="https://jia-media-desk.firebaseapp.com/">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="jia-logo-176.png">
  <link rel="apple-touch-icon" href="jia-logo-176.png">
  <title>JIA Alabang · Media Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="jia.css?v=4">
  <style>
    .shell { max-width:760px; margin:auto; padding:12px 16px 44px; }
    .welcome { margin:18px 0 4px; }
    .welcome h1 { margin-bottom:2px; }
    /* App grid, Odoo-style: square icon, label underneath. */
    .apps { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:18px 12px; margin-top:18px; }
    .app { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; text-decoration:none; color:var(--ink); font-weight:700; font-size:.9rem; line-height:1.2; border-radius:14px; padding:6px 2px; }
    .app:hover .icon { transform:translateY(-2px); box-shadow:0 8px 18px rgba(3,12,6,.18); }
    .icon { display:grid; place-items:center; width:76px; height:76px; border-radius:18px; color:white; transition:transform .12s, box-shadow .12s; box-shadow:0 3px 8px rgba(3,12,6,.12); }
    .icon svg { width:38px; height:38px; }
    .tag { display:block; font-size:.7rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .i-check { background:var(--green-dark); }
    .i-cam { background:#c0161b; }
    .i-program { background:var(--green-mid); }
    .i-flow { background:#1f5f8b; }
    .i-sheet { background:#2e7d4f; }
    .i-demo { background:#5b6b61; }
    .i-visuals { background:#7a3fa0; }
    .i-roadmap { background:#c77a12; }
    .i-register { background:#b0256b; }
    .app-search input { width:100%; min-height:46px; margin-top:16px; padding:10px 14px; border:1px solid #adc4b7; border-radius:12px; background:white; color:var(--ink); }
    .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    h2.section { margin:28px 0 0; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .reminders { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px; }
    .reminders li { display:grid; gap:2px; padding:10px 12px; background:var(--sage); border-radius:10px; }
    .small-note { font-size:.88rem; }
  </style>
</head>
<body data-app="home">
  <header class="jia-header"></header>
  <script src="shell.js?v=1"></script>
  <main class="shell">
    <div class="welcome">
      <h1>Media Desk</h1>
      <p class="muted" style="margin:0">Everything the media team uses on Sunday, in one place. Sign in once with your Google account; it carries across the apps.</p>
    </div>

    <label class="app-search"><span class="sr">Search apps</span><input type="search" id="app-search" placeholder="Search apps… (or just start typing)" autocomplete="off"></label>
    <nav class="apps" id="apps" aria-label="Apps"></nav>
    <p class="muted" id="apps-empty" hidden>No app matches that.</p>

    <section class="card" id="sunday-card" aria-label="This Sunday" hidden></section>
  </main>
  <script src="sunday-reminders.js?v=4"></script>
</body>
</html>
